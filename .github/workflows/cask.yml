name: Cask

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "CLI repo under addozhang"
        required: true
        type: choice
        options:
          - nexus-cli
          - jira-cli
          - confluence-cli
      binary:
        description: "Binary name"
        required: true
        type: choice
        options:
          - nx
          - jr
          - cfl
      desc:
        description: "Cask description"
        required: true
        type: string
      tag:
        description: "Release tag (e.g. v0.3.1); defaults to the latest release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: addozhang/${{ inputs.repo }}
          BIN: ${{ inputs.binary }}
          DESC: ${{ inputs.desc }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          fi
          VER="${TAG#v}"
          echo "Generating Casks/${BIN}.rb for $REPO@$TAG"

          arm_sha=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/${BIN}_${VER}_darwin_arm64.tar.gz" | sha256sum | cut -d' ' -f1)
          intel_sha=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/${BIN}_${VER}_darwin_amd64.tar.gz" | sha256sum | cut -d' ' -f1)
          larm_sha=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/${BIN}_${VER}_linux_arm64.tar.gz" | sha256sum | cut -d' ' -f1)
          lintel_sha=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/${BIN}_${VER}_linux_amd64.tar.gz" | sha256sum | cut -d' ' -f1)

          cask_file=$(mktemp)
          cat > "$cask_file" <<EOF
          # This file was generated by the tap Cask workflow. DO NOT EDIT.
          cask "${BIN}" do
            version "${VER}"

            on_macos do
              on_arm do
                sha256 "${arm_sha}"
                url "https://github.com/${REPO}/releases/download/v#{version}/${BIN}_#{version}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "${intel_sha}"
                url "https://github.com/${REPO}/releases/download/v#{version}/${BIN}_#{version}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "${larm_sha}"
                url "https://github.com/${REPO}/releases/download/v#{version}/${BIN}_#{version}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "${lintel_sha}"
                url "https://github.com/${REPO}/releases/download/v#{version}/${BIN}_#{version}_linux_amd64.tar.gz"
              end
            end

            name "${BIN}"
            desc "${DESC}"
            homepage "https://github.com/${REPO}"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "${BIN}"

            # No zap stanza required
          end
          EOF
          cat "$cask_file"

          b64=$(base64 -w0 < "$cask_file")
          sha=$(gh api "repos/addozhang/homebrew-tap/contents/Casks/${BIN}.rb?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            jq -n --arg msg "cask: update ${BIN} to ${VER}" --arg b64 "$b64" --arg sha "$sha" \
              '{message:$msg, content:$b64, branch:"main", sha:$sha}' |
              gh api -X PUT "repos/addozhang/homebrew-tap/contents/Casks/${BIN}.rb" --input -
          else
            jq -n --arg msg "cask: add ${BIN} ${VER}" --arg b64 "$b64" \
              '{message:$msg, content:$b64, branch:"main"}' |
              gh api -X PUT "repos/addozhang/homebrew-tap/contents/Casks/${BIN}.rb" --input -
          fi
          echo "Casks/${BIN}.rb updated to ${VER}"
